<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ハロウィンカレンダー 印刷受付</title>
<style>
  :root{--ink:#251d2c;--muted:#746a79;--orange:#e87521;--line:#e4dbe6;--wait:#fff1dd;--ready:#e9f6ef;--done:#f0f0f2}
  *{box-sizing:border-box}body{margin:0;background:#f6f2f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
  header{position:sticky;top:0;z-index:3;background:#241a2d;color:#fff;padding:14px 16px;box-shadow:0 3px 12px rgba(0,0,0,.18)}
  .bar{max-width:1180px;margin:auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  h1{font-size:18px;margin:0}.sub{font-size:11px;color:#cfc3d5}
  button,a.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}
  .refresh{background:#e87521;color:#fff}.wrap{max-width:1180px;margin:18px auto;padding:0 14px 40px}
  .filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter button{background:#fff;border:1px solid var(--line);color:#493a50}.filter button.active{background:#382640;color:#fff}
  .stats{font-size:12px;color:var(--muted);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 20px rgba(45,31,52,.07)}
  .thumb{background:#eee;display:flex;align-items:center;justify-content:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:contain;background:white}
  .body{padding:13px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.num{font-size:24px;font-weight:900}.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px}
  .WAIT{background:var(--wait);color:#814900}.UPLOADING{background:#eef3ff;color:#3558a8}.UPLOAD_ERROR{background:#fff0ef;color:#a02a20}.READY{background:var(--ready);color:#246341}.DONE{background:var(--done);color:#666}
  .meta{font-size:12px;line-height:1.55;color:var(--muted);margin:8px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .wide{grid-column:1/-1}
  .print{background:#23192b;color:#fff}.png{background:#f3edf5;color:#44304d}
  .state-toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px;grid-column:1/-1}
  .state-toggle{min-height:46px;border:1px solid var(--line);background:#fff;color:#65566b}
  .state-toggle.off{background:#fff7ef;color:#8a4c17;border-color:#f0d8c0}
  .state-toggle.on.printed{background:#e7f5ed;color:#23623f;border-color:#c8e7d5}
  .state-toggle.on.delivered{background:#eceaf1;color:#4f4654;border-color:#d9d4de}
  .state-toggle:disabled{opacity:.38;cursor:not-allowed}
  .empty{padding:40px;text-align:center;color:#7b7080;background:#fff;border-radius:16px}
  .auto-print-panel{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    margin-bottom:12px;padding:12px 14px;border-radius:14px;
    background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(45,31,52,.05)
  }
  .auto-print-copy{min-width:0}
  .auto-print-title{font-size:14px;font-weight:900;color:#35283c;margin-bottom:3px}
  .auto-print-note{font-size:11px;line-height:1.5;color:var(--muted)}
  .auto-print-toggle{
    min-width:148px;padding:11px 14px;border-radius:999px;border:1px solid var(--line);
    background:#f3eff4;color:#5e5363;font-weight:900
  }
  .auto-print-toggle.on{
    background:#e7f5ed;color:#23623f;border-color:#bfe0cd;
    box-shadow:0 0 0 3px rgba(45,122,80,.08)
  }
  .auto-print-status{
    width:100%;font-size:11px;line-height:1.5;padding-top:8px;border-top:1px solid #eee7ef;color:#6b6070
  }
  .auto-print-status.busy{color:#9a5a10;font-weight:800}
  .auto-print-status.ok{color:#23623f;font-weight:800}
  .auto-print-status.error{color:#a02a20;font-weight:800}
</style>
</head>
<body>
<header><div class="bar"><div><h1 id="adminTitle">ハロウィンカレンダー 印刷受付</h1><div class="sub"><span id="adminShopName">会場を読み込み中…</span> ／ <span id="adminShopId"></span></div></div><button class="refresh" id="refresh">更新</button></div></header>
<main class="wrap">
  <div class="auto-print-panel">
    <div class="auto-print-copy">
      <div class="auto-print-title">このPCの自動印刷</div>
      <div class="auto-print-note" id="autoPrintNote">OFF：受付が来たら「A4で印刷」を押します。</div>
    </div>
    <button class="auto-print-toggle" id="autoPrintToggle" type="button" aria-pressed="false">自動印刷 OFF</button>
    <div class="auto-print-status" id="autoPrintStatus">手動印刷モードです。</div>
  </div>
  <div class="filter"><button class="active" data-filter="WAIT">未印刷</button><button data-filter="UPLOAD_ERROR">送信エラー</button><button data-filter="UPLOADING">送信中</button><button data-filter="READY">印刷済み</button><button data-filter="DONE">受渡済み</button><button data-filter="ALL">すべて</button></div>
  <div class="stats" id="stats">読み込み中…</div>
  <div class="grid" id="grid"></div>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getFirestore, collection, query, where, doc, getDoc, updateDoc, serverTimestamp, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  const firebaseConfig={apiKey:"AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",authDomain:"my-uchiwa-queue.firebaseapp.com",projectId:"my-uchiwa-queue",storageBucket:"my-uchiwa-queue.firebasestorage.app",messagingSenderId:"245883628081",appId:"1:245883628081:web:ab7f00f01ba256ebca8310",measurementId:"G-W4S3EKL9TY"};
  const db=getFirestore(initializeApp(firebaseConfig));
  const SOURCE="halloween-photo-calendar-2026";
  const params=new URLSearchParams(window.location.search);
  const shopId=(params.get("shop")||"main").replace(/[^a-zA-Z0-9_-]/g,"")||"main";
  const defaultSettings={shopName:"ハロウィンカレンダー会場",shopCode:"C"};
  let shopSettings={...defaultSettings};

  async function loadShopSettings(){
    try{
      const snap=await getDoc(doc(db,"settings",shopId));
      shopSettings=snap.exists()?{...defaultSettings,...snap.data()}:{...defaultSettings};
    }catch(e){
      console.error(e);
      shopSettings={...defaultSettings};
    }
    document.getElementById("adminShopName").textContent=shopSettings.shopName||defaultSettings.shopName;
    document.getElementById("adminShopId").textContent=`shop=${shopId}`;
    document.getElementById("adminTitle").textContent=`${shopSettings.shopName||defaultSettings.shopName}｜印刷受付`;
    document.title=`${shopSettings.shopName||defaultSettings.shopName}｜カレンダー印刷受付`;
  }
  let all=[];let filter="WAIT";
  const grid=document.getElementById("grid"),stats=document.getElementById("stats");
  const autoPrintToggle=document.getElementById("autoPrintToggle");
  const autoPrintNote=document.getElementById("autoPrintNote");
  const autoPrintStatus=document.getElementById("autoPrintStatus");

  const AUTO_PRINT_KEY=`halloween-calendar-autoprint:${shopId}`;
  const AUTO_PRINT_CLIENT_KEY=`halloween-calendar-autoprint-client:${shopId}`;

  let autoPrintEnabled=localStorage.getItem(AUTO_PRINT_KEY)==="1";
  let autoPrintClientId=localStorage.getItem(AUTO_PRINT_CLIENT_KEY)||"";
  if(!autoPrintClientId){
    autoPrintClientId=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(36).slice(2)}`);
    localStorage.setItem(AUTO_PRINT_CLIENT_KEY,autoPrintClientId);
  }

  let unsubscribeOrders=null;
  let snapshotInitialized=false;
  let autoPrintQueue=[];
  let autoPrintBusy=false;
  const queuedOrderIds=new Set();

  function tsVal(v){try{return v?.toMillis?.()||0}catch{return 0}}
  function fmt(v){try{return v?.toDate?.().toLocaleString("ja-JP")||""}catch{return ""}}

  function setAutoPrintStatus(text,type=""){
    autoPrintStatus.textContent=text;
    autoPrintStatus.className=`auto-print-status ${type}`.trim();
  }

  function updateAutoPrintUI(){
    autoPrintToggle.classList.toggle("on",autoPrintEnabled);
    autoPrintToggle.textContent=autoPrintEnabled?"自動印刷 ON":"自動印刷 OFF";
    autoPrintToggle.setAttribute("aria-pressed",autoPrintEnabled?"true":"false");
    autoPrintNote.textContent=autoPrintEnabled
      ?"ON：この画面を開いておけば、新しく届いた受付を自動で印刷します。"
      :"OFF：受付が来たら「A4で印刷」を押します。";

    if(!autoPrintBusy){
      setAutoPrintStatus(
        autoPrintEnabled
          ?"受付待機中です。Edgeのサイレント印刷設定済みPCで使用してください。"
          :"手動印刷モードです。",
        autoPrintEnabled?"ok":""
      );
    }
  }

  autoPrintToggle.addEventListener("click",()=>{
    if(!autoPrintEnabled){
      const ok=confirm(
        "このPCを自動印刷用にしますか？\n\n" +
        "Edgeのサイレント印刷設定と、印刷に使う複合機の既定プリンター設定が必要です。"
      );
      if(!ok)return;
      autoPrintEnabled=true;
      localStorage.setItem(AUTO_PRINT_KEY,"1");
    }else{
      autoPrintEnabled=false;
      localStorage.setItem(AUTO_PRINT_KEY,"0");
      autoPrintQueue=[];
      queuedOrderIds.clear();
    }
    updateAutoPrintUI();
  });

  updateAutoPrintUI();
  async function load(){
    stats.textContent="読み込み中…";
    grid.innerHTML="";
    try{
      await loadShopSettings();

      if(unsubscribeOrders){
        unsubscribeOrders();
        unsubscribeOrders=null;
      }

      snapshotInitialized=false;
      const q=query(collection(db,"orders"),where("shopId","==",shopId));

      unsubscribeOrders=onSnapshot(q,snap=>{
        all=snap.docs
          .map(d=>({id:d.id,...d.data()}))
          .filter(o=>o.source===SOURCE)
          .sort((a,b)=>tsVal(b.createdAt)-tsVal(a.createdAt));

        render();

        // 最初の読み込み時は、既存の未印刷を自動印刷しない。
        // 以後に追加・WAITへ更新された受付だけ対象にする。
        if(!snapshotInitialized){
          snapshotInitialized=true;
          return;
        }

        if(autoPrintEnabled){
          for(const change of snap.docChanges()){
            if(change.type!=="added" && change.type!=="modified")continue;
            const o={id:change.doc.id,...change.doc.data()};
            if(
              o.source===SOURCE &&
              (o.status||"WAIT")==="WAIT" &&
              !!o.imageUrl &&
              !o.autoPrintState
            ){
              enqueueAutoPrint(o);
            }
          }
        }
      },err=>{
        console.error(err);
        stats.textContent="読み込みに失敗しました。Firebaseの権限・通信を確認してください。";
        grid.innerHTML='<div class="empty">データを取得できませんでした。</div>';
        setAutoPrintStatus("受付の監視に失敗しました。通信状態を確認してください。","error");
      });
    }catch(e){
      console.error(e);
      stats.textContent="読み込みに失敗しました。Firebaseの権限・通信を確認してください。";
      grid.innerHTML='<div class="empty">データを取得できませんでした。</div>';
      setAutoPrintStatus("受付の監視を開始できませんでした。","error");
    }
  }

  function render(){
    const list=filter==="ALL"?all:all.filter(x=>(x.status||"WAIT")===filter);
    stats.textContent=`${shopSettings.shopName||defaultSettings.shopName} ／ 全 ${all.length}件 ／ 表示 ${list.length}件`;
    if(!list.length){grid.innerHTML='<div class="empty">該当する受付はありません。</div>';return;}
    grid.innerHTML=list.map(o=>{
      const hasImage=!!o.imageUrl;
      const thumb=hasImage
        ? `<img src="${o.imageUrl}" alt="${o.shortId||o.id}">`
        : `<div style="padding:18px;text-align:center;color:#8d7c91;font-weight:800">画像未受信<br><small>${o.status||""}</small></div>`;
      const imageActions=hasImage
        ? `<button class="print" data-print="${o.imageUrl}" data-orientation="${(o.orientation==="landscape" || Number(o.width)>Number(o.height))?"landscape":"portrait"}">A4で印刷</button><a class="btn png" href="${o.imageUrl}" target="_blank" rel="noopener">PNGを開く</a>`
        : `<button class="print" type="button" disabled style="opacity:.35;cursor:not-allowed">画像未受信</button><span class="btn png" style="opacity:.45">再送待ち</span>`;
      const err=o.uploadErrorCode?`<br>エラー：<code>${String(o.uploadErrorCode)}</code>`:"";
      const autoState=o.autoPrintState==="PRINTING"
        ? `<br><span style="color:#9a5a10;font-weight:800">自動印刷中…</span>`
        : o.autoPrintState==="ERROR"
          ? `<br><span style="color:#a02a20;font-weight:800">自動印刷エラー（手動印刷してください）</span>`
          : "";
      const isLandscape=o.orientation==="landscape" || Number(o.width)>Number(o.height);
      const orientationLabel=isLandscape?"A4横":"A4縦";
      const dims=`${o.width|| (isLandscape?3508:2480)}×${o.height|| (isLandscape?2480:3508)}px`;
      const thumbAspect=isLandscape?"297/210":"210/297";
      const status=o.status||"WAIT";
      const isPrinted=status==="READY" || status==="DONE";
      const isDelivered=status==="DONE";
      const printLabel=isPrinted?"印刷済":"印刷未";
      const deliveryLabel=isDelivered?"受渡済":"受渡未";
      const deliveryDisabled=!isPrinted && !isDelivered;

      return `<article class="card" data-id="${o.id}">
      <div class="thumb" style="aspect-ratio:${thumbAspect}">${thumb}</div>
      <div class="body"><div class="top"><div class="num">${o.shortId||o.id}</div><span class="badge ${status}">${status}</span></div>
      <div class="meta">${fmt(o.createdAt)}<br>印刷枚数：<b>${o.copies||1}枚</b> ／ ${orientationLabel} ${dims}<br>${o.shopName||shopSettings.shopName||""}${err}${autoState}</div>
      <div class="actions">${imageActions}
        <div class="state-toggles">
          <button class="state-toggle ${isPrinted?"on printed":"off"}" data-action="toggle-print" ${hasImage?"":"disabled"}>${printLabel}</button>
          <button class="state-toggle ${isDelivered?"on delivered":"off"}" data-action="toggle-delivery" ${deliveryDisabled?"disabled":""}>${deliveryLabel}</button>
        </div>
      </div></div></article>`;
    }).join("");
  }
  function printImage(url,orientation="portrait"){
    const isLandscape=orientation==="landscape";
    const pageSize=isLandscape?"A4 landscape":"A4 portrait";
    const pageW=isLandscape?"297mm":"210mm";
    const pageH=isLandscape?"210mm":"297mm";
    const w=window.open("","_blank");if(!w){alert("ポップアップがブロックされました。");return;}
    w.document.write(`<!doctype html><html><head><title>A4印刷</title><style>@page{size:${pageSize};margin:0}html,body{margin:0;width:${pageW};height:${pageH}}img{width:${pageW};height:${pageH};object-fit:fill;display:block}</style></head><body><img src="${url}" onload="setTimeout(()=>window.print(),250)"></body></html>`);w.document.close();
  }

  function silentPrintImage(url,orientation="portrait",copies=1){
    return new Promise((resolve,reject)=>{
      const isLandscape=orientation==="landscape";
      const pageSize=isLandscape?"A4 landscape":"A4 portrait";
      const pageW=isLandscape?"297mm":"210mm";
      const pageH=isLandscape?"210mm":"297mm";
      const count=Math.max(1,Math.min(10,Number(copies)||1));

      const iframe=document.createElement("iframe");
      iframe.setAttribute("aria-hidden","true");
      iframe.style.position="fixed";
      iframe.style.right="-10000px";
      iframe.style.bottom="0";
      iframe.style.width="1px";
      iframe.style.height="1px";
      iframe.style.opacity="0";
      iframe.style.pointerEvents="none";
      document.body.appendChild(iframe);

      const pages=Array.from({length:count},()=>`<section class="page"><img src="${url}"></section>`).join("");
      const html=`<!doctype html><html><head><meta charset="utf-8"><title>自動印刷</title>
        <style>
          @page{size:${pageSize};margin:0}
          html,body{margin:0;padding:0}
          .page{width:${pageW};height:${pageH};overflow:hidden;page-break-after:always}
          .page:last-child{page-break-after:auto}
          img{width:${pageW};height:${pageH};object-fit:fill;display:block}
        </style></head><body>${pages}</body></html>`;

      let settled=false;
      const finish=(ok,err)=>{
        if(settled)return;
        settled=true;
        setTimeout(()=>iframe.remove(),300);
        ok?resolve():reject(err||new Error("auto-print-failed"));
      };

      iframe.onload=()=>{
        try{
          const idoc=iframe.contentDocument;
          const imgs=[...idoc.images];
          Promise.all(imgs.map(img=>img.complete
            ? Promise.resolve()
            : new Promise((res,rej)=>{
                img.addEventListener("load",res,{once:true});
                img.addEventListener("error",()=>rej(new Error("print-image-load-failed")),{once:true});
              })
          )).then(()=>{
            const iw=iframe.contentWindow;
            const fallback=setTimeout(()=>finish(true),4000);
            iw.addEventListener("afterprint",()=>{
              clearTimeout(fallback);
              finish(true);
            },{once:true});
            iw.focus();
            setTimeout(()=>iw.print(),250);
          }).catch(err=>finish(false,err));
        }catch(err){
          finish(false,err);
        }
      };

      iframe.srcdoc=html;
    });
  }

  function enqueueAutoPrint(order){
    if(!autoPrintEnabled)return;
    if(queuedOrderIds.has(order.id))return;
    queuedOrderIds.add(order.id);
    autoPrintQueue.push(order);
    processAutoPrintQueue();
  }

  async function claimAutoPrint(orderId){
    const ref=doc(db,"orders",orderId);
    return await runTransaction(db,async tx=>{
      const snap=await tx.get(ref);
      if(!snap.exists())return null;

      const d=snap.data();
      const status=d.status||"WAIT";

      if(
        d.source!==SOURCE ||
        d.shopId!==shopId ||
        status!=="WAIT" ||
        !d.imageUrl ||
        d.autoPrintState
      ){
        return null;
      }

      tx.update(ref,{
        autoPrintState:"PRINTING",
        autoPrintClientId,
        autoPrintStartedAt:serverTimestamp(),
        updatedAt:serverTimestamp()
      });

      return {id:orderId,...d};
    });
  }

  async function processAutoPrintQueue(){
    if(autoPrintBusy || !autoPrintEnabled)return;
    const next=autoPrintQueue.shift();
    if(!next)return;

    autoPrintBusy=true;
    setAutoPrintStatus(`${next.shortId||next.id} を自動印刷しています…`,"busy");

    try{
      const claimed=await claimAutoPrint(next.id);
      if(claimed){
        const orientation=(claimed.orientation==="landscape" || Number(claimed.width)>Number(claimed.height))
          ?"landscape"
          :"portrait";

        await silentPrintImage(claimed.imageUrl,orientation,claimed.copies||1);

        await updateDoc(doc(db,"orders",claimed.id),{
          status:"READY",
          autoPrintState:"PRINTED",
          autoPrintCompletedAt:serverTimestamp(),
          updatedAt:serverTimestamp()
        });

        setAutoPrintStatus(
          `${claimed.shortId||claimed.id} を印刷しました。次の受付を待っています。`,
          "ok"
        );
      }
    }catch(err){
      console.error("auto print failed",err);
      try{
        await updateDoc(doc(db,"orders",next.id),{
          autoPrintState:"ERROR",
          autoPrintError:String(err?.message||err),
          updatedAt:serverTimestamp()
        });
      }catch(e){
        console.error("failed to save auto print error",e);
      }
      setAutoPrintStatus(
        `${next.shortId||next.id} の自動印刷に失敗しました。「A4で印刷」で印刷してください。`,
        "error"
      );
    }finally{
      queuedOrderIds.delete(next.id);
      autoPrintBusy=false;
      if(autoPrintEnabled && autoPrintQueue.length){
        setTimeout(processAutoPrintQueue,500);
      }else if(autoPrintEnabled && !autoPrintStatus.classList.contains("error")){
        setTimeout(()=>{
          if(!autoPrintBusy){
            setAutoPrintStatus("受付待機中です。新しい受付が届くと自動印刷します。","ok");
          }
        },1800);
      }
    }
  }
  grid.addEventListener("click",async e=>{
    const p=e.target.closest("[data-print]");
    if(p){
      printImage(p.dataset.print,p.dataset.orientation||"portrait");
      return;
    }

    const actionBtn=e.target.closest("[data-action]");
    if(!actionBtn) return;

    const card=e.target.closest(".card");
    const id=card?.dataset.id;
    if(!id) return;

    const o=all.find(x=>x.id===id);
    if(!o) return;

    const current=o.status||"WAIT";
    let nextStatus=current;

    if(actionBtn.dataset.action==="toggle-print"){
      // 印刷済 → 印刷未 に戻す場合、受渡済も同時に未へ戻る
      nextStatus=(current==="READY" || current==="DONE") ? "WAIT" : "READY";
    }else if(actionBtn.dataset.action==="toggle-delivery"){
      // 受渡済 → 受渡未 は、印刷済の状態に戻す
      if(current==="DONE"){
        nextStatus="READY";
      }else if(current==="READY"){
        nextStatus="DONE";
      }else{
        return;
      }
    }

    actionBtn.disabled=true;
    try{
      await updateDoc(doc(db,"orders",id),{
        status:nextStatus,
        updatedAt:serverTimestamp()
      });
      o.status=nextStatus;
      render();
    }catch(err){
      console.error(err);
      alert("更新できませんでした。");
      actionBtn.disabled=false;
    }
  });
  document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render();}));
  document.getElementById("refresh").addEventListener("click",load);
  load();
</script>
</body></html>
