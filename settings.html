<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>会場設定｜ハロウィンカレンダー</title>
<style>
:root{--ink:#2c2032;--muted:#766b7a;--orange:#e87521;--line:#e7dde8;--bg:#f7f3f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:24px 14px 50px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(40,25,48,.08);margin-bottom:14px}
h1{font-size:24px;margin:0 0 8px}.sub{font-size:13px;color:var(--muted);line-height:1.7}
label{display:block;font-size:12px;font-weight:800;margin:16px 0 6px}
input{width:100%;padding:13px;border:1px solid #d9cfdb;border-radius:12px;font-size:16px}
button,a.btn{display:block;width:100%;padding:13px 15px;border-radius:13px;border:0;font-weight:900;text-align:center;text-decoration:none;margin-top:12px}
button{background:var(--orange);color:#fff;cursor:pointer}.btn{background:#33243b;color:#fff}
.url{font-size:12px;word-break:break-all;background:#faf7fb;border:1px solid var(--line);padding:10px;border-radius:10px;margin-top:7px}
.ok{display:none;margin-top:12px;padding:11px;border-radius:11px;background:#ebf7ef;color:#23623e;font-weight:800}
.note{font-size:12px;color:var(--muted);line-height:1.7}
code{background:#f1ebf3;padding:2px 5px;border-radius:5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>営業所・会場設定</h1>
    <div class="sub">営業所名と受付番号コードを保存すると、この営業所専用のお客様URLとadmin URLを自動で発行します。<br>同じFirebaseを使いながら、注文と通し番号は営業所ごとに分かれます。</div>

    <label for="shopName">営業所・会場名</label>
    <input id="shopName" placeholder="例：中国新聞廿日市東営業所">

    <label for="shopCode">受付番号コード（1〜4文字）</label>
    <input id="shopCode" maxlength="4" placeholder="例：HE">
    <div class="note">例：コード HE の会場では <b>HE001 → HE002 → HE003</b> と発行します。</div>

    <label for="shopIdInput">URL用 営業所ID</label>
    <input id="shopIdInput" placeholder="例：he">
    <div class="note">受付番号コードを入力すると自動で入ります。通常はそのままでOKです。</div>

    <button id="saveBtn">この会場設定を保存</button>
    <div class="ok" id="saved">保存しました。</div>
  </div>

  <div class="card">
    <b>お客様用URL</b>
    <div class="url" id="customerUrl"></div>
    <a class="btn" id="customerLink" target="_blank">お客様画面を開く</a>
    <button type="button" id="copyCustomer" style="background:#fff;color:#33243b;border:1px solid #d9cfdb">お客様URLをコピー</button>

    <b style="display:block;margin-top:18px">店舗用 admin URL</b>
    <div class="url" id="adminUrl"></div>
    <a class="btn" id="adminLink" target="_blank">この営業所の受付画面を開く</a>
    <button type="button" id="copyAdmin" style="background:#fff;color:#33243b;border:1px solid #d9cfdb">admin URLをコピー</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBKSYZgaSVTu-HO_lS1Tp2eFjSjMuOONNI",
  authDomain:"my-uchiwa-queue.firebaseapp.com",
  projectId:"my-uchiwa-queue",
  storageBucket:"my-uchiwa-queue.firebasestorage.app",
  messagingSenderId:"245883628081",
  appId:"1:245883628081:web:ab7f00f01ba256ebca8310",
  measurementId:"G-W4S3EKL9TY"
};
const db=getFirestore(initializeApp(firebaseConfig));
const params=new URLSearchParams(location.search);
let currentShopId=(params.get("shop")||"").replace(/[^a-zA-Z0-9_-]/g,"").toLowerCase();

const shopName=document.getElementById("shopName");
const shopCode=document.getElementById("shopCode");
const shopIdInput=document.getElementById("shopIdInput");

function normalizeShopId(value){
  return String(value||"")
    .trim()
    .toLowerCase()
    .replace(/[^a-z0-9_-]/g,"")
    .slice(0,32);
}

function updateLinks(shopId){
  const base=location.href.split("?")[0].replace(/settings\.html$/,"");
  const id=normalizeShopId(shopId);
  if(!id){
    document.getElementById("customerUrl").textContent="保存後に表示されます";
    document.getElementById("adminUrl").textContent="保存後に表示されます";
    document.getElementById("customerLink").removeAttribute("href");
    document.getElementById("adminLink").removeAttribute("href");
    return;
  }

  const customer=`${base}index.html?shop=${encodeURIComponent(id)}`;
  const admin=`${base}admin.html?shop=${encodeURIComponent(id)}`;
  document.getElementById("customerUrl").textContent=customer;
  document.getElementById("adminUrl").textContent=admin;
  document.getElementById("customerLink").href=customer;
  document.getElementById("adminLink").href=admin;
}

shopCode.addEventListener("input",()=>{
  const code=shopCode.value.trim().replace(/[^a-zA-Z0-9]/g,"").toLowerCase().slice(0,4);
  if(!shopIdInput.dataset.edited){
    shopIdInput.value=code;
    updateLinks(code);
  }
});

shopIdInput.addEventListener("input",()=>{
  shopIdInput.dataset.edited="1";
  shopIdInput.value=normalizeShopId(shopIdInput.value);
  updateLinks(shopIdInput.value);
});

async function load(){
  // 旧URLの shop=ID / shop=main はテンプレート扱いにして、
  // 実際の営業所IDとしては使わない
  if(currentShopId==="id" || currentShopId==="main"){
    currentShopId="";
  }

  if(!currentShopId){
    updateLinks("");
    return;
  }

  try{
    const snap=await getDoc(doc(db,"settings",currentShopId));
    if(snap.exists()){
      const d=snap.data();
      shopName.value=d.shopName||"";
      shopCode.value=d.shopCode||"";
      shopIdInput.value=currentShopId;
      shopIdInput.dataset.edited="1";
      updateLinks(currentShopId);
    }
  }catch(e){ console.error(e); }
}
load();

document.getElementById("saveBtn").addEventListener("click",async()=>{
  const name=shopName.value.trim();
  const code=shopCode.value.trim().replace(/[^a-zA-Z0-9]/g,"").toUpperCase().slice(0,4);

  let shopId=normalizeShopId(shopIdInput.value);
  if(!shopId){
    shopId=normalizeShopId(code);
    shopIdInput.value=shopId;
  }

  if(!name){ alert("営業所・会場名を入力してください。"); return; }
  if(!code){ alert("受付番号コードを入力してください。"); return; }
  if(!shopId){ alert("URL用 営業所IDを入力してください。"); return; }

  const btn=document.getElementById("saveBtn");
  btn.disabled=true;

  try{
    const ref=doc(db,"settings",shopId);
    await setDoc(ref,{
      shopId,
      shopName:name,
      shopCode:code,
      calendarServiceEnabled:true,
      updatedAt:serverTimestamp()
    },{merge:true});

    currentShopId=shopId;

    // 保存後に settings 自身のURLも確定した営業所IDへ切り替える
    const newSettingsUrl=`${location.pathname}?shop=${encodeURIComponent(shopId)}`;
    history.replaceState(null,"",newSettingsUrl);

    updateLinks(shopId);

    const saved=document.getElementById("saved");
    saved.style.display="block";
    saved.innerHTML=
      `保存しました。<br>` +
      `<b>${name}</b> の受付番号は <b>${code}001</b> から始まります。<br>` +
      `下に、この営業所専用URLを表示しました。`;

    // URL欄が見える位置まで移動
    document.getElementById("customerUrl").scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }catch(e){
    console.error(e);
    alert("保存できませんでした。Firebaseの権限を確認してください。");
  }finally{
    btn.disabled=false;
  }
});

document.getElementById("copyCustomer").addEventListener("click",async()=>{
  const value=document.getElementById("customerUrl").textContent;
  if(!value || value==="保存後に表示されます") return;
  await navigator.clipboard.writeText(value);
  alert("お客様URLをコピーしました。");
});

document.getElementById("copyAdmin").addEventListener("click",async()=>{
  const value=document.getElementById("adminUrl").textContent;
  if(!value || value==="保存後に表示されます") return;
  await navigator.clipboard.writeText(value);
  alert("admin URLをコピーしました。");
});

</script>
</body>
</html>
